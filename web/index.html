<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pulse: habits and workouts, streak by streak. A Flutter habit tracker with streak heatmaps and live charts.">
  <meta name="theme-color" content="#0d0a14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Pulse</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0a14; }
    /* Shown while the engine loads, then handed to the app's own splash,
       which opens on the same colour. */
    #boot { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity .35s ease; }
    #boot svg { width: 64px; height: 64px; }
    #boot path { stroke-dasharray: 140; stroke-dashoffset: 140; animation: trace 1.4s ease-in-out infinite; }
    @keyframes trace { 60%, 100% { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { #boot path { animation: none; stroke-dashoffset: 0; opacity: .5; } }
    body.ready #boot { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <svg viewBox="0 0 128 128">
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff5a36"/><stop offset="1" stop-color="#ff2d6f"/></linearGradient></defs>
      <path d="M18 68 L38 68 L47 44 L58 88 L66 63 L77 75 L108 41" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
    </svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('ready');
      setTimeout(function () { var b = document.getElementById('boot'); if (b) b.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
